[package]
name = "bhoo-web-demo"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bhoo = { package = "libbhoo", path = "../../libs/ui/libbhoo", default-features = false }
wisp = { path = "../wisp" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
