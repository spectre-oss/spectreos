<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="beercss/beer.min.css">
<style>
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif}body{padding:24px;background:#fbf7fb;color:#1d1b1e}body.dark{background:#141218;color:#e6e0e9}.fixture{width:100%}.fixture p{margin:0 0 16px}.page-controls{display:flex;gap:8px;margin-bottom:8px}.page-controls button{width:50%;margin:0}.page{width:100%;height:140px}.page .panel{width:100%;height:140px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#e8def8;color:#1d192b;font:22px Arial,sans-serif}.dark .page .panel{background:#4a4458;color:#e8def8}html[data-reduced=true] .page{animation:none!important}
body.shape-fixture{background:#fafaf8;color:#1f2320;--primary:#2b6a4d}body.dark.shape-fixture{background:#121216;color:#f0f0f5;--primary:#d0bcff}.shape-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}.shape-item{height:74px;text-align:center;font:9px Arial,sans-serif}.shape-item .shape{width:44px;height:44px;margin:0 auto!important}.shape-item span{display:block;height:18px;line-height:18px;margin-top:2px;white-space:nowrap;overflow:hidden}
.rotation-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.rotation-item{text-align:center;height:122px;font:12px Arial,sans-serif}.rotation-item .shape{width:56px;height:56px;margin:12px auto 0!important}.rotation-item span{display:block;margin-top:8px;line-height:24px}html[data-reduced=true] .rotation-item .shape{animation:none!important}
.media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;height:112px}.media-item{height:100px;font:12px Arial,sans-serif}.media-item img{display:block;object-fit:cover;width:64px;height:64px}.media-item:nth-child(2) img{width:128px;max-width:100%;border-radius:8px}.media-item span{display:block;height:20px;line-height:20px;margin-top:4px}.media-wide{display:block!important;width:300px!important;max-width:100%;height:120px!important;object-fit:cover;border-radius:16px!important;margin:0!important}.media-note{margin-top:26px!important}
.wave-fixture button.wave{width:100%;height:40px;margin:0;border-radius:20px;background:#2b6a4d;color:white;font:500 14px Arial,sans-serif}.dark.wave-fixture button.wave{background:#d0bcff;color:#381e72}.wave-fixture .wave-count{margin-top:12px}
html[data-reduced=true] .wave-fixture .wave::after{transition:none!important}
</style><script type="module" src="beercss-reference.js"></script></head><body><div class="fixture"><p>Page navigation</p><nav class="page-controls"><button data-target="one">Page one</button><button data-target="two">Page two</button></nav><div class="pages"><div id="one" class="page active left"><div class="panel">Page one</div></div><div id="two" class="page right"><div class="panel">Page two</div></div></div></div></body></html>
