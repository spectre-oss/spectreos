name: Release

# Push-to-main release pipeline.
#
# Stage 1 (`plan-and-version`) is the ONLY job that writes to the repository: it detects
# which components changed, bumps their versions from Conventional Commits, creates ONE
# release commit plus one tag per component and pushes them atomically.
# Stage 2 jobs only read the resulting release commit and publish artifacts.
#
# Never add a pull_request trigger here: PR validation lives in pr-checks.yml, which is
# read-only. codes/shiraz-core is a private-scope submodule and is never checked out.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_components:
        description: "Comma-separated component names to release even without releasable commits (patch bump)"
        required: false
        default: ""
        type: string
      force_landing:
        description: "Redeploy the landing site even if no landing files changed"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  plan-and-version:
    name: Plan and version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.release.outputs.sha || '' }}
      any_released: ${{ steps.release.outputs.any_released || 'false' }}
      released_components: ${{ steps.release.outputs.released_components || '[]' }}
      publish_libbhoo: ${{ steps.release.outputs.publish_libbhoo || 'false' }}
      libbhoo_version: ${{ steps.release.outputs.libbhoo_version || '' }}
      libbhoo_tag: ${{ steps.release.outputs.libbhoo_tag || '' }}
      has_release_apps: ${{ steps.release.outputs.has_release_apps || 'false' }}
      release_apps_matrix: ${{ steps.release.outputs.release_apps_matrix || '[]' }}
      release_calendar: ${{ steps.release.outputs.release_calendar || 'false' }}
      calendar_version: ${{ steps.release.outputs.calendar_version || '' }}
      calendar_tag: ${{ steps.release.outputs.calendar_tag || '' }}
      release_spectref1: ${{ steps.release.outputs.release_spectref1 || 'false' }}
      spectref1_version: ${{ steps.release.outputs.spectref1_version || '' }}
      spectref1_tag: ${{ steps.release.outputs.spectref1_tag || '' }}
      deploy_landing: ${{ steps.release.outputs.deploy_landing || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Require Python 3.11+
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'

      - uses: dtolnay/rust-toolchain@stable

      - name: Release only the current main tip
        id: tip
        run: |
          git fetch origin main --tags
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            if git merge-base --is-ancestor HEAD origin/main; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "This push is no longer the tip of main."
              exit 0
            fi
            echo "main diverged from this run; refusing to rewrite history."
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Test release tooling
        if: steps.tip.outputs.skip != 'true'
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Plan, version and push release
        id: release
        if: steps.tip.outputs.skip != 'true'
        env:
          FORCE_COMPONENTS: ${{ inputs.force_components }}
          FORCE_LANDING: ${{ inputs.force_landing }}
        run: |
          set -euo pipefail
          args=(--write --push
            --before "${{ github.event.before }}"
            --name "SpectreOS-CI" --email "ci@spectreos.dev"
            --github-output "$GITHUB_OUTPUT")
          if [ -n "${FORCE_COMPONENTS:-}" ]; then
            args+=(--force-components "$FORCE_COMPONENTS")
          fi
          if [ "${FORCE_LANDING:-false}" = "true" ]; then
            args+=(--force-landing)
          fi
          if python3 scripts/release.py "${args[@]}"; then
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ] \
            && git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "main advanced during release; a later workflow will publish."
            {
              echo "sha="
              echo "any_released=false"
              echo "released_components=[]"
              echo "publish_libbhoo=false"
              echo "has_release_apps=false"
              echo "release_apps_matrix=[]"
              echo "release_calendar=false"
              echo "release_spectref1=false"
              echo "deploy_landing=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit 1

  publish-libbhoo:
    name: Publish libbhoo to crates.io
    runs-on: ubuntu-latest
    needs: [plan-and-version]
    if: needs.plan-and-version.outputs.publish_libbhoo == 'true'
    permissions:
      contents: write
    env:
      LIBBHOO_VERSION: ${{ needs.plan-and-version.outputs.libbhoo_version }}
      LIBBHOO_TAG: ${{ needs.plan-and-version.outputs.libbhoo_tag }}
      RELEASE_SHA: ${{ needs.plan-and-version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan-and-version.outputs.sha }}
          fetch-depth: 0
          submodules: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codes/libs/ui/libbhoo
          key: publish-libbhoo

      - name: Test libbhoo
        working-directory: codes/libs/ui/libbhoo
        run: cargo test --locked --lib

      - name: Package libbhoo
        working-directory: codes/libs/ui/libbhoo
        run: cargo package --locked

      - name: Publish to crates.io (idempotent)
        working-directory: codes/libs/ui/libbhoo
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -A 'spectreos-release-ci (https://github.com/spectre-oss/spectreos)' \
            "https://crates.io/api/v1/crates/libbhoo/${LIBBHOO_VERSION}")"
          case "$status" in
            200)
              echo "libbhoo ${LIBBHOO_VERSION} is already on crates.io; skipping publish."
              ;;
            404)
              cargo publish --locked
              ;;
            *)
              echo "Unexpected crates.io status ${status}; refusing to guess." >&2
              exit 1
              ;;
          esac

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_release.py --write \
            --component libbhoo \
            --tag "$LIBBHOO_TAG" \
            --version "$LIBBHOO_VERSION" \
            --sha "$RELEASE_SHA" \
            --changelog codes/libs/ui/libbhoo/CHANGELOG.md

  release-apps:
    name: Release ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [plan-and-version]
    if: needs.plan-and-version.outputs.has_release_apps == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-and-version.outputs.release_apps_matrix || '[]') }}
    env:
      APP_NAME: ${{ matrix.name }}
      APP_PACKAGE: ${{ matrix.package }}
      APP_BINARY: ${{ matrix.binary }}
      APP_DIR: ${{ matrix.dir }}
      APP_FEATURES: ${{ matrix.features }}
      APP_VERSION: ${{ matrix.version }}
      APP_TAG: ${{ matrix.tag }}
      APP_CHANGELOG: ${{ matrix.changelog }}
      RELEASE_SHA: ${{ needs.plan-and-version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan-and-version.outputs.sha }}
          fetch-depth: 0
          submodules: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            build-essential \
            libgbm-dev \
            libdrm-dev \
            libseat-dev \
            libsystemd-dev \
            libudev-dev \
            libinput-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libegl-dev \
            libgles-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.dir }}
          key: release-${{ matrix.name }}

      - name: Build release binary
        run: |
          set -euo pipefail
          cargo build --release --locked \
            --manifest-path "$APP_DIR/Cargo.toml" \
            --features "$APP_FEATURES" \
            --bin "$APP_BINARY"

      - name: Strip and stage binary
        run: |
          set -euo pipefail
          built="$APP_DIR/target/release/$APP_BINARY"
          test -f "$built" || { echo "missing release binary: $built" >&2; exit 1; }
          strip "$built"
          test -s "$built" || { echo "release binary is empty: $built" >&2; exit 1; }
          file "$built" | grep -q 'ELF 64-bit' || { echo "not an ELF binary" >&2; exit 1; }
          mkdir -p dist
          install -m 0755 "$built" "dist/${APP_BINARY}-linux-x86_64"
          ls -l dist

      - name: Publish GitHub Release (binary only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_release.py --write \
            --component "$APP_NAME" \
            --tag "$APP_TAG" \
            --version "$APP_VERSION" \
            --sha "$RELEASE_SHA" \
            --changelog "$APP_CHANGELOG" \
            --asset "dist/${APP_BINARY}-linux-x86_64"

  release-calendar:
    name: Release calendar
    runs-on: ubuntu-latest
    needs: [plan-and-version]
    if: needs.plan-and-version.outputs.release_calendar == 'true'
    permissions:
      contents: write
    env:
      CALENDAR_VERSION: ${{ needs.plan-and-version.outputs.calendar_version }}
      CALENDAR_TAG: ${{ needs.plan-and-version.outputs.calendar_tag }}
      RELEASE_SHA: ${{ needs.plan-and-version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan-and-version.outputs.sha }}
          fetch-depth: 0
          submodules: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codes/apps/calendar
          key: release-calendar

      - name: Test calendar
        run: cargo test --locked --manifest-path codes/apps/calendar/Cargo.toml

      # Calendar is embedded in Wisp and has no standalone binary: the release carries
      # the changelog notes only.
      - name: Create GitHub Release (embedded in Wisp, no binary)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_release.py --write \
            --component calendar \
            --tag "$CALENDAR_TAG" \
            --version "$CALENDAR_VERSION" \
            --sha "$RELEASE_SHA" \
            --changelog codes/apps/calendar/CHANGELOG.md

  release-spectref1:
    name: Release spectref1
    runs-on: ubuntu-latest
    needs: [plan-and-version]
    if: needs.plan-and-version.outputs.release_spectref1 == 'true'
    permissions:
      contents: write
    env:
      SPECTREF1_VERSION: ${{ needs.plan-and-version.outputs.spectref1_version }}
      SPECTREF1_TAG: ${{ needs.plan-and-version.outputs.spectref1_tag }}
      RELEASE_SHA: ${{ needs.plan-and-version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan-and-version.outputs.sha }}
          fetch-depth: 0
          submodules: false

      - name: Test spectref1
        run: make -C codes/os/specrte-nix-f1 test

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish_release.py --write \
            --component spectref1 \
            --tag "$SPECTREF1_TAG" \
            --version "$SPECTREF1_VERSION" \
            --sha "$RELEASE_SHA" \
            --changelog codes/os/specrte-nix-f1/CHANGELOG.md

  build-landing:
    name: Build landing site
    runs-on: ubuntu-latest
    needs: [plan-and-version]
    if: needs.plan-and-version.outputs.deploy_landing == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan-and-version.outputs.sha }}
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # `npm test` rebuilds landing/dist (with several base paths), so it must run
      # BEFORE the final production build that is uploaded.
      - name: Test landing site
        working-directory: landing
        run: npm test

      - name: Build landing site
        working-directory: landing
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/dist

  deploy-landing:
    name: Deploy landing to GitHub Pages
    runs-on: ubuntu-latest
    needs: [plan-and-version, build-landing]
    if: needs.plan-and-version.outputs.deploy_landing == 'true'
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
